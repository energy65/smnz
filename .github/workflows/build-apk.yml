name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  construction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;34.0.0 platforms;android-34
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # 解密JKS密钥到根目录
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > shenma.jks
      # 编译release包
      - name: Build release APK
        run: |
          ./gradlew clean
          ./gradlew assembleRelease
      # 固定build-tools路径，手动apksigner签名
      - name: Sign APK manually
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release.apk"
          ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="app/build/outputs/apk/release/app-release-signed.apk"
          
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          
          "$BUILD_TOOLS/apksigner" sign \
            --ks shenma.jks \
            --ks-pass pass:$KEYSTORE_PASSWORD \
            --key-pass pass:$KEY_PASSWORD \
            --ks-key-alias $KEY_ALIAS \
            --out "$SIGNED_APK" "$ALIGNED_APK"
      # 查找所有apk，增加ls查看目录内容，方便调试
      - name: Find all APK files
        run: |
          find . -name "*.apk"
          ls -la app/build/outputs/apk/release/
      # 上传【已签名】的apk
      - name: Upload Signed APK
        uses: actions/upload-artifact@v6
        with:
          name: ShenmaAPP-v3.7.11-release
          path: app/build/outputs/apk/release/app-release-signed.apk
